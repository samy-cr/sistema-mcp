name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SistemaMcp.Tests -c Release

      - name: Publish (win-x86, self-contained)
        run: dotnet publish src/SistemaMcp -c Release -o publish/SistemaMcp -p:PublishSingleFile=true

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, README.de.md, LICENSE publish/SistemaMcp/
          Compress-Archive publish/SistemaMcp/* SistemaMcp-win-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SistemaMcp-win-x86
          path: SistemaMcp-win-x86.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SistemaMcp-win-x86.zip
